<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 Carousel</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Keep the carousel at the top and limit its size */
    body {
      margin: 0;
      padding: 0;
    }

    .top-carousel {
      max-width: 1200px;   /* increase width so pictures are larger */
      margin: 12px auto 0; /* place at top with small top gap and centered */
    }

    /* Constrain image height so carousel doesn't occupy whole page but is large enough to see */
    .top-carousel .carousel-inner img {
      width: 100%;
      height: 520px;       /* control visible height (change as needed) */
      object-fit: cover;   /* default: crop to fill */
      display: block;
      background: #111;    /* background shown when using object-fit: contain */
    }

    /* Make the first slide show the whole picture (letterboxed if needed) */
    .top-carousel .carousel-inner img.full-image {
      object-fit: contain; /* show the whole image */
      background: #000;    /* black letterbox background */
    }

    /* Optional: make captions a bit more readable */
    .carousel-caption {
      background: rgba(0,0,0,0.35);
      padding: .5rem 1rem;
      border-radius: .25rem;
    }

    @media (max-width:767px){
      .top-carousel .carousel-inner img { height: 300px; }
    }
  </style>
</head>
<body>

<div class="top-carousel">
  <!-- Attach id and carousel classes so controls/indicators work -->
  <div id="exampleCarousel" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#exampleCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <!-- Carousel Inner -->
    <div class="carousel-inner">
      <div class="carousel-item active">
        <!-- added class "full-image" so this slide displays the entire picture -->
        <img src="c:\Users\Spirit\Pictures\Screenshots\Screenshot 2025-10-09 195910.png" class="d-block w-100 full-image" alt="Slide 1">
        <div class="carousel-caption d-none d-md-block">
          <h5>First Slide</h5>
          <p>This is the first slide description.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="c:\Users\Spirit\Downloads\78204a00-1ee2-4e13-815b-aac9cb2fdbf3.jfif" class="d-block w-100" alt="Slide 2">
        <div class="carousel-caption d-none d-md-block">
          <h5>Second Slide</h5>
          <p>This is the second slide description.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="c:\Users\Spirit\Downloads\9b627759-1af0-4b48-9629-7658542a4d04.jfif" class="d-block w-100" alt="Slide 3">
        <div class="carousel-caption d-none d-md-block">
          <h5>Third Slide</h5>
          <p>This is the third slide description.</p>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#exampleCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#exampleCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
