<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Carousel with Sketch Effect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      background: #f7f7f7;
    }
    .container {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    #myCarousel {
      width: 100vw;
      height: 100vh;
    }
    .carousel-inner,
    .carousel-item,
    .carousel-item img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #fff;
    }
    .sketch {
      filter:
        grayscale(100%)
        contrast(1.3)
        brightness(1.1)
        url(#sketch);
      background: #fff;
    }
    .carousel-caption {
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      padding: 1rem;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h2 class="text-center text-light mt-3">Bootstrap Carousel with Sketch Effect</h2>
  
  <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="First slide">
        <div class="carousel-caption">
          <h5>First Slide</h5>
          <p>Normal Image</p>
        </div>
      </div>

      <div class="carousel-item">
        <img src="sketch.png" class="d-block w-100 sketch" alt="Second slide">
        <div class="carousel-caption">
          <h5>Second Slide</h5>
          <p>Sketch Effect</p>
        </div>
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Third slide">
        <div class="carousel-caption">
          <h5>Third Slide</h5>
          <p>Another Normal Image</p>
        </div>
      </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>

<!-- Sketch-like SVG filter -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" style="display:none;">
  <filter id="sketch">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
  </filter>
</svg>

<!-- Enhanced Sketch-like SVG filter -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" style="display:none;">
  <filter id="sketch">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" result="turb"/>
    <feDiffuseLighting in="turb" lighting-color="white" surfaceScale="2" result="light">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="0.8" k2="0.2" k3="0.2" k4="0"/>
    <feDisplacementMap in="SourceGraphic" in2="turb" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
